services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ons
      POSTGRES_PASSWORD: ons_dev_password
      POSTGRES_DB: ons
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ons -d ons"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
